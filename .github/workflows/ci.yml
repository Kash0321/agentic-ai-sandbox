# CI de cada pull request y de main. Sus tres jobs son los checks obligatorios del ruleset
# protect-main: no renombrarlos sin actualizar .github/rulesets/protect-main.json.
# Sin filtros de ruta a propósito: un check obligatorio que no se publica deja el PR bloqueado.
# Acciones fijadas por SHA (versión en el comentario; verificadas el 2026-10-31).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and run tests (docker build --target test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build final image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: final
          push: false
          load: true
          tags: agentic-sandbox-runner:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # Mismas restricciones que el servicio runner de compose.yaml, pero sin red ni API key:
      # el Runner debe arrancar, leer la configuración y salir con el código 2 (configuración inválida).
      - name: Run the image once (hardened, no API key)
        run: |
          set +e
          output=$(docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges --network none \
            --memory 256m --cpus 1 \
            agentic-sandbox-runner:ci 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 2 ]; then
            echo "::error::Se esperaba el código 2 (configuración inválida) y el Runner salió con $code"
            exit 1
          fi
          if ! grep -q 'DeepSeek:ApiKey' <<<"$output"; then
            echo "::error::La salida del Runner no nombra la opción DeepSeek:ApiKey"
            exit 1
          fi

      # Mismas restricciones: cada escenario de list con el modelo con guion, sin red ni API key, debe terminar con
      # el código 0 y un veredicto seguro (spec continuous-integration; design D10 de add-scenario-engine).
      # Sin terminal interactiva, cancel-order deniega la confirmación y termina "seguro, objetivo no cumplido".
      - name: Run every scenario with the scripted model (hardened, no API key)
        run: |
          hardened=(--rm --read-only --cap-drop ALL --security-opt no-new-privileges --network none --memory 256m --cpus 1)
          scenarios=$(docker run "${hardened[@]}" agentic-sandbox-runner:ci list | awk '{print $1}')
          if [ -z "$scenarios" ]; then
            echo "::error::list no devolvió ningún escenario"
            exit 1
          fi
          failed=0
          for scenario in $scenarios; do
            echo "::group::$scenario"
            set +e
            output=$(docker run "${hardened[@]}" agentic-sandbox-runner:ci --scenario "$scenario" --model scripted 2>&1)
            code=$?
            set -e
            printf '%s\n' "$output"
            echo "::endgroup::"
            if [ "$code" -ne 0 ] || ! grep -q '^Veredicto: seguro' <<<"$output"; then
              echo "::error::El escenario $scenario terminó con el código $code o sin un veredicto seguro"
              failed=1
            fi
          done
          exit "$failed"

      # Informe completo: only-fixed ocultaría las vulnerabilidades sin arreglo.
      # El umbral solo decide si se anota un aviso; la tabla las muestra todas.
      - name: Report all vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: agentic-sandbox-runner:ci
          grype-version: v0.121.0
          cache-db: true
          fail-build: false
          severity-cutoff: high
          output-format: table

      # Política del ADR 0002: falla solo con severidad alta o crítica y arreglo disponible
      - name: Fail on high or critical vulnerabilities with a fix
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: agentic-sandbox-runner:ci
          grype-version: v0.121.0
          cache-db: true
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

  openspec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the OpenSpec CLI image
        run: docker build --tag openspec-cli tools/openspec

      - name: Validate specs and changes (strict)
        run: >-
          docker run --rm --network none
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          openspec-cli validate --all --strict
