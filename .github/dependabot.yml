# Actualizaciones de versión semanales, un PR por ecosistema (ver docs/learn/09).
# Las actualizaciones de seguridad no pertenecen a estos grupos y llegan cuando se publican.
version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    groups:
      nuget:
        patterns: ["*"]

  # Imágenes base del Dockerfile de la solución y de la imagen de herramientas de OpenSpec
  - package-ecosystem: docker
    directories:
      - /
      - /tools/openspec
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    groups:
      docker:
        patterns: ["*"]

  # Imágenes de los servicios de compose (el panel de trazas). Solo actualizaciones de versión: según GitHub Docs, este
  # ecosistema no admite actualizaciones de seguridad (comprobado el 2026-11-07).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    groups:
      docker-compose:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    groups:
      github-actions:
        patterns: ["*"]
