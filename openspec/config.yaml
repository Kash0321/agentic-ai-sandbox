schema: spec-driven

context: |
  Sandbox de arquitectura agéntica en .NET 10 (PoC), no un ERP de producción.
  El LLM es DeepSeek (API compatible con OpenAI) vía Microsoft.Extensions.AI (IChatClient).
  El dominio es dummy e in-memory: simula reglas de negocio, validaciones, fallos inducidos y cambios de estado.
  Fuera de alcance: bases de datos reales, integración con ERP/CRM reales, autenticación de usuarios, UI, despliegue.
  Escribe todos los artefactos (proposal, design, specs, tasks) en español.
  Mantén en inglés los identificadores de código, los nombres de tools y los códigos de error (p. ej. ORDER_NOT_FOUND).
  Las reglas de negocio se especifican y validan en el dominio, nunca en prompts. El LLM propone, el dominio decide.
  Todo lo que no sea la llamada al LLM debe ser determinista y verificable con un IChatClient falso, sin red ni API key.
  Las convenciones de código y las reglas de diseño están en AGENTS.md; no las dupliques en los artefactos.
  El proyecto tiene un objetivo de aprendizaje: la documentación de docs/learn/ se escribe en paralelo al código y todo change debe actualizarla.
  El proyecto se construye, prueba y ejecuta también en contenedor (Dockerfile multi-etapa, usuario no root, secretos por fichero, nunca en la imagen); ver AGENTS.md sección 10. El repositorio es público y open source (MIT).

rules:
  proposal:
    - Indica explícitamente qué queda fuera de alcance
    - Referencia la fase de docs/plan.md a la que pertenece el change
    - Lista los conceptos nuevos que introduce y qué documento de docs/learn/ los cubre o debe crearse
  specs:
    - Cada requisito usa SHALL o MUST y lleva al menos un escenario Given/When/Then
    - Los contratos de tools especifican nombre, parámetros, resultado y códigos de error estables
    - Los errores de negocio se devuelven como ToolResult con ToolError; ninguna tool lanza excepciones hacia el LLM
    - Los guardrails se especifican con el código de bloqueo que devuelven (p. ej. BLOCKED_BY_POLICY)
  design:
    - Justifica las decisiones que afecten a la separación entre dominio e invocación del LLM
    - Si la decisión trasciende un único change, indícalo para registrarla como ADR en docs/adr/
    - Si el change partió de un explore, recoge los experimentos realizados y sus resultados observados, distinguiéndolos de las suposiciones (AGENTS.md, sección 6)
  tasks:
    - Divide en tareas pequeñas y verificables
    - Incluye siempre las tareas de tests (caso feliz, cada código de error y schema de las tools)
    - Incluye siempre una tarea de documentación de aprendizaje en docs/learn/ (crear o actualizar el documento, con lo observado en la práctica, y ampliar el glosario)
    - Si el change fija versiones de paquetes, imágenes o acciones, usa la última estable oficial verificada en la fuente primaria (nunca en páginas de documentación) y anota la fecha; sin preview ni RC salvo decisión expresa (AGENTS.md, sección 11)
    - Si el change afecta a build, dependencias, configuración o ejecución, incluye su comprobación en contenedor (docker build --target test) y la revisión de que no se filtran secretos a la imagen
    - Cierra con dotnet build sin warnings y dotnet test en verde

operations:
  apply:
    guidance:
      - No marques una tarea como completada si no está probada
      - Trabaja en una rama propia para el change (ver AGENTS.md, sección 9); nunca directamente sobre main
      - No des el change por terminado sin la documentación de aprendizaje de docs/learn/ al día
      - Al cerrar, propón conceptos nuevos que merezca la pena documentar
      - Ejecuta dotnet build y dotnet test antes de dar el change por terminado
      - Al cerrar, sigue la definición de terminado de AGENTS.md (sección 8): validate --all --strict, build y todos los tests en verde, /opsx:verify sin críticos y /opsx:archive, todo en la rama del change y antes de abrir el PR
  archive:
    guidance:
      - Archiva en la rama del change, antes de abrir el PR, y solo tras /opsx:verify sin problemas críticos y con build y todos los tests automáticos en verde
      - No incluyas en el commit del change los ficheros ajenos a él que aparezcan en el árbol (por ejemplo, los skills regenerados tras actualizar el CLI de OpenSpec); van a su propia rama de mantenimiento
